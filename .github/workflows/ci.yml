name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-check-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-check-

      - name: Run cargo check
        run: cargo check --all-targets --all-features

  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-clippy-

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-

      - name: Run tests
        run: cargo test --all-features --verbose

      - name: Run examples
        if: runner.os == 'Linux'
        run: |
          for ex in scopes typed_builder performance; do
            cargo run --example "$ex" --all-features
          done

  test-features:
    name: Test Feature Combinations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-features-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-features-

      - name: Test no default features
        run: cargo test --no-default-features

      - name: Test with tracing
        run: cargo test --features tracing

      - name: Test with async
        run: cargo test --features async

      - name: Test all features
        run: cargo test --all-features

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-doc-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-doc-

      - name: Check documentation
        env:
          RUSTDOCFLAGS: -Dwarnings
        run: cargo doc --no-deps --all-features

  msrv:
    name: Minimum Supported Rust Version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust 1.85.0
        uses: dtolnay/rust-toolchain@1.100.0

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-msrv-

      - name: Check MSRV
        run: cargo check --all-features

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage report
        run: cargo llvm-cov --all-features --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          fail_ci_if_error: false

  fuzz:
    name: Fuzz (smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      # NOTE: both cache blocks below are intentionally mirrored in nightly-fuzz.yml.
      # Build inputs are keyed on the lockfile alone: folding them into the
      # run-id key minted a fresh multi-hundred-MB entry every run and evicted
      # other jobs from the repo's 10GB LRU cache budget.
      - name: Cache fuzz build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            fuzz/target
          key: ${{ runner.os }}-fuzz-build-${{ hashFiles('fuzz/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-fuzz-build-

      # The corpus is the only thing that needs to grow every run, so it alone
      # takes the run-id key to force a fresh save; restore-keys fall back to
      # the newest previous cache. Shared with nightly-fuzz.yml's fuzz job.
      - name: Cache fuzz corpus
        uses: actions/cache@v5
        with:
          path: fuzz/corpus
          key: ${{ runner.os }}-fuzz-corpus-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-fuzz-corpus-

      - name: Run fuzz targets (30s each)
        # cargo-fuzz defaults --target to its own build triple; taiki-e ships a
        # musl-linked binary and nightly has no musl std (E0463).
        run: |
          for target in fuzz_container fuzz_scoped fuzz_concurrent fuzz_lifecycle; do
            cargo +nightly fuzz run "$target" --target "$(rustc -vV | sed -n 's/^host: //p')" -- -max_total_time=30 -timeout=10
          done

  bindings-test:
    name: Bindings Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-bindings-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-bindings-

      - name: Build FFI cdylib
        run: cargo rustc --release --features ffi --crate-type cdylib

      - name: Test Go bindings
        env:
          # The cgo directives in ffi/go/di/di.go already resolve
          # -L${SRCDIR}/../../../target/release at compile time; CGO_LDFLAGS is
          # belt-and-braces, LD_LIBRARY_PATH is required at test runtime.
          CGO_LDFLAGS: -L${{ github.workspace }}/target/release
          LD_LIBRARY_PATH: ${{ github.workspace }}/target/release
        run: cd ffi/go/di && go test ./...

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Test Python bindings
        env:
          # The ctypes loader checks DI_LIBRARY_PATH (a file path) first, so
          # this is the mechanism it directly supports. `pip install -e .` is a
          # plain setuptools editable install and never runs download_native.py.
          DI_LIBRARY_PATH: ${{ github.workspace }}/target/release/libdependency_injector.so
        run: |
          pip install pytest
          cd ffi/python
          pip install -e .
          pytest tests/ -v

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Test Node.js bindings
        env:
          # findLibraryPath checks DI_LIBRARY_PATH (a file path) first;
          # --ignore-scripts skips the postinstall native downloader.
          DI_LIBRARY_PATH: ${{ github.workspace }}/target/release/libdependency_injector.so
        run: |
          cd ffi/nodejs
          pnpm install --ignore-scripts
          pnpm test

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Test C# bindings
        env:
          # NativeLibraryResolver checks DI_LIBRARY_PATH (a file path) before
          # its runtimes/ layout and dev-path fallbacks.
          DI_LIBRARY_PATH: ${{ github.workspace }}/target/release/libdependency_injector.so
        run: cd ffi/csharp && dotnet test DependencyInjector.Tests

  docs-build:
    name: Docs Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm dependencies
        uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('docs/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        working-directory: docs
        run: pnpm install --frozen-lockfile

      - name: Build docs
        working-directory: docs
        run: pnpm run build

  miri:
    name: Miri
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # informative for now — tighten to gating once the unsafe surface is miri-clean
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - name: Run miri
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
        run: cargo +nightly miri test --lib

  lint-ci:
    name: Lint CI Config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Setup just
        uses: extractions/setup-just@v2

      - name: Justfile syntax check
        run: just --list

      - name: Validate workflow YAML
        run: |
          python3 - <<'PY'
          import glob
          import sys

          import yaml

          failed = False
          for path in sorted(
              glob.glob(".github/workflows/*.yml")
              + glob.glob(".github/workflows/*.yaml")
          ):
              try:
                  with open(path, encoding="utf-8") as fh:
                      yaml.safe_load(fh)
              except yaml.YAMLError as exc:
                  print(f"FAIL {path}: {exc}")
                  failed = True
              else:
                  print(f"OK   {path}")
          sys.exit(1 if failed else 0)
          PY

  bench-go:
    name: Go Benchmarks (smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Install Go toolchain
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache-dependency-path: benchmarks/go-comparison/go.sum

      - name: Check formatting
        working-directory: benchmarks/go-comparison
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needs to run on: $unformatted"
            exit 1
          fi

      - name: Vet
        working-directory: benchmarks/go-comparison
        run: go vet ./...

      # Executes every benchmark once. Catches compile errors and deterministic
      # crashes cheaply (~1s), but note it does NOT catch concurrency bugs: a
      # single iteration never builds enough parallelism. That is the next
      # step's job.
      - name: Smoke-run every benchmark
        working-directory: benchmarks/go-comparison
        run: go test -run=XXX -bench=. -benchtime=1x ./...

      # The load-bearing check. BenchmarkConcurrentReads/uber_dig once aborted
      # the whole test binary with "fatal error: concurrent map read and map
      # write", which also killed every benchmark scheduled after it.
      #
      # Verified against that bug by reverting the fix: the race detector exits
      # non-zero, while the smoke step above and even a plain -benchtime=10000x
      # run both still exit 0. Go's built-in concurrent-map detection is
      # opportunistic, so -race is the only reliable gate here — do not drop it.
      - name: Race-check the concurrency benchmarks
        working-directory: benchmarks/go-comparison
        run: go test -run=XXX -bench=BenchmarkConcurrentReads -benchtime=100x -race ./...

  bench-node:
    name: Node Benchmarks (smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: benchmarks/nodejs-comparison
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: benchmarks/nodejs-comparison
        run: pnpm exec tsc --noEmit -p tsconfig.json

      # DI_BENCH_SMOKE collapses every benchmark to a couple of iterations, so
      # this executes each code path in about a second. The printed timings are
      # meaningless -- the gate is "does it still run", not "how fast".
      - name: Smoke-run benchmarks
        working-directory: benchmarks/nodejs-comparison
        env:
          DI_BENCH_SMOKE: '1'
        run: pnpm bench

  bench-python:
    name: Python Benchmarks (smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install benchmark dependencies
        run: python -m pip install --quiet dependency-injector injector punq

      - name: Syntax check
        run: python -m compileall -q benchmarks/python-comparison/benchmark.py

      # See the note on bench-node: smoke mode, not a measurement.
      - name: Smoke-run benchmarks
        working-directory: benchmarks/python-comparison
        env:
          DI_BENCH_SMOKE: '1'
        run: python benchmark.py

  bench-csharp:
    name: C# Benchmarks (smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Build
        working-directory: benchmarks/csharp-comparison
        run: dotnet build --configuration Release

      # See the note on bench-node: smoke mode, not a measurement.
      - name: Smoke-run benchmarks
        working-directory: benchmarks/csharp-comparison
        env:
          DI_BENCH_SMOKE: '1'
        run: dotnet run --configuration Release --no-build
