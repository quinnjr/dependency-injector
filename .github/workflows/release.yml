name: Release

on:
  push:
    tags:
      - 'v[0-9]+.*'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Verify version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          CARGO_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) doesn't match Cargo.toml version ($CARGO_VERSION)"
            exit 1
          fi

      - name: Run full test suite
        run: cargo test --all-features

      - name: Check clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build release
        run: cargo build --release --all-features

  publish:
    name: Publish to crates.io
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Check crates.io for already-published versions
        id: check
        run: |
          # Mirrors the check in scripts/publish.sh — both are superseded by
          # release-plz; see ROADMAP.md item 7. A published version returns
          # a "version" field from the crates.io API, an unknown one returns "errors".
          check_published() {
            local crate_name=$1
            local version=$2
            local response
            if ! response=$(curl -s "https://crates.io/api/v1/crates/${crate_name}/${version}"); then
              echo "::warning::crates.io API unreachable — proceeding to publish (cargo will reject duplicates)"
              return 1  # Treat as not published; cargo publish is the backstop
            fi
            if echo "$response" | grep -q '"version"' && ! echo "$response" | grep -q '"errors"'; then
              return 0  # Already published
            else
              return 1  # Not published
            fi
          }

          MAIN_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          DERIVE_VERSION=$(grep '^version' dependency-injector-derive/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')

          if check_published "dependency-injector-derive" "$DERIVE_VERSION"; then
            echo "::notice::dependency-injector-derive v${DERIVE_VERSION} is already published, skipping"
            echo "derive_already=true" >> "$GITHUB_OUTPUT"
          else
            echo "dependency-injector-derive v${DERIVE_VERSION} is not published yet"
            echo "derive_already=false" >> "$GITHUB_OUTPUT"
          fi

          if check_published "dependency-injector" "$MAIN_VERSION"; then
            echo "::notice::dependency-injector v${MAIN_VERSION} is already published, skipping"
            echo "already=true" >> "$GITHUB_OUTPUT"
          else
            echo "dependency-injector v${MAIN_VERSION} is not published yet"
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish dependency-injector-derive to crates.io
        if: steps.check.outputs.derive_already == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cd dependency-injector-derive
          cargo publish --no-verify
          # Wait for crates.io to index the derive crate before the main crate
          echo "Waiting 30 seconds for crates.io to index..."
          sleep 30

      - name: Publish dependency-injector to crates.io
        if: steps.check.outputs.already == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --no-verify

  github-release:
    name: Create GitHub Release
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          # Get the previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -z "$PREV_TAG" ]; then
            # First release, get all commits
            COMMITS=$(git log --pretty=format:"- %s" --no-merges)
          else
            # Get commits since previous tag
            COMMITS=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s" --no-merges)
          fi

          # Group commits by type
          FEATURES=$(echo "$COMMITS" | grep -E "^- feat" || true)
          FIXES=$(echo "$COMMITS" | grep -E "^- fix" || true)
          DOCS=$(echo "$COMMITS" | grep -E "^- docs" || true)
          OTHER=$(echo "$COMMITS" | grep -vE "^- (feat|fix|docs)" || true)

          # Random heredoc delimiter (per GitHub's docs) so commit messages
          # cannot terminate the block early and inject extra outputs.
          delimiter="$(openssl rand -hex 8)"
          {
            echo "changelog<<${delimiter}"
            echo "## What's Changed"
            echo ""
            if [ -n "$FEATURES" ]; then
              echo "### ✨ Features"
              echo "$FEATURES"
              echo ""
            fi
            if [ -n "$FIXES" ]; then
              echo "### 🐛 Bug Fixes"
              echo "$FIXES"
              echo ""
            fi
            if [ -n "$DOCS" ]; then
              echo "### 📚 Documentation"
              echo "$DOCS"
              echo ""
            fi
            if [ -n "$OTHER" ]; then
              echo "### 🔧 Other Changes"
              echo "$OTHER"
              echo ""
            fi
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: ${{ contains(github.ref, '-alpha') || contains(github.ref, '-beta') || contains(github.ref, '-rc') }}

