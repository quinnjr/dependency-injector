name: Nightly Fuzz

on:
  schedule:
    # Run every day at 04:00 UTC
    - cron: '0 4 * * *'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz Targets
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      # NOTE: both cache blocks below are intentionally mirrored in ci.yml (fuzz job).
      # Build inputs are keyed on the lockfile alone: folding them into the
      # run-id key minted a fresh multi-hundred-MB entry every run and evicted
      # other jobs from the repo's 10GB LRU cache budget.
      - name: Cache fuzz build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            fuzz/target
          key: ${{ runner.os }}-fuzz-build-${{ hashFiles('fuzz/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-fuzz-build-

      # The corpus is the only thing that needs to grow every run, so it alone
      # takes the run-id key to force a fresh save; restore-keys fall back to
      # the newest previous cache. Shared with ci.yml's fuzz job.
      - name: Cache fuzz corpus
        uses: actions/cache@v5
        with:
          path: fuzz/corpus
          key: ${{ runner.os }}-fuzz-corpus-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-fuzz-corpus-

      - name: Run fuzz targets
        # cargo-fuzz defaults --target to its own build triple; taiki-e ships a
        # musl-linked binary and nightly has no musl std (E0463).
        run: |
          for target in fuzz_container fuzz_scoped fuzz_concurrent fuzz_lifecycle; do
            echo "::group::${target}"
            cargo fuzz run "$target" --target "$(rustc -vV | sed -n 's/^host: //p')" -- -max_total_time=300 -timeout=10
            echo "::endgroup::"
          done

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore

  report:
    name: Report Failure
    needs: [fuzz]
    # cancelled() catches the 45-minute job timeout — the most likely outcome
    # here — which failure() alone misses.
    if: ${{ failure() || cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Split out of the fuzz job so cargo fuzz / build scripts / proc macros
    # never execute with an issue-write token.
    permissions:
      contents: read
      issues: write
    steps:
      - name: Report failure as issue
        # The fuzz job is already red; a broken notifier must not become the
        # visible cause of the run.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -o pipefail
          TITLE="Nightly fuzz failure"
          BODY="Nightly fuzz run failed: ${RUN_URL}"
          # Capture gh's exit status directly. Piping straight into `head -n 1`
          # would yield head's status (Actions' default `bash -e` has no
          # pipefail), so an auth/rate-limit failure produced an empty EXISTING
          # and opened a duplicate issue on every run. Buffering first also
          # keeps pipefail from tripping on head's SIGPIPE.
          if ! ISSUES=$(gh issue list --state open --search "\"$TITLE\" in:title" \
            --json number,title --jq ".[] | select(.title == \"$TITLE\") | .number"); then
            echo "::warning::gh issue list failed; skipping dedupe"
            exit 0
          fi
          EXISTING=$(printf '%s\n' "$ISSUES" | head -n 1)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
