name: Nightly Fuzz

on:
  schedule:
    # Run every day at 04:00 UTC
    - cron: '0 4 * * *'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz Targets
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - name: Cache fuzz build and corpus
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            fuzz/target
            fuzz/corpus
          # NOTE: this cache block is intentionally mirrored in ci.yml (fuzz job) so both workflows share the warmed corpus.
          # The corpus grows every run, so the key includes the run id to force
          # a fresh save; restore-keys fall back to the newest previous cache.
          key: ${{ runner.os }}-fuzz-${{ hashFiles('fuzz/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-fuzz-${{ hashFiles('fuzz/Cargo.lock') }}-
            ${{ runner.os }}-fuzz-

      - name: Run fuzz targets
        # Fuzz targets keep intentionally-dead payload fields; do not inherit
        # the global -Dwarnings gate (lint jobs own that).
        env:
          RUSTFLAGS: ""
        run: |
          for target in fuzz_container fuzz_scoped fuzz_concurrent fuzz_lifecycle; do
            echo "::group::${target}"
            cargo fuzz run "$target" --target x86_64-unknown-linux-gnu -- -max_total_time=300 -timeout=10
            echo "::endgroup::"
          done

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore

      - name: Report failure as issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="Nightly fuzz failure"
          BODY="Nightly fuzz run failed: ${RUN_URL}"
          EXISTING=$(gh issue list --state open --search "\"$TITLE\" in:title" \
            --json number,title --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n 1)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
